name: FinSight CI Pipeline

# 1. When the pipeline runs
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. What jobs it will perform
jobs:
  lint-and-test:
    runs-on: ubuntu-latest 

    # 3. Additional services (Postgres in this case)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 4. The exact steps adapted to your folder structure
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Linter
      run: |
        cd app
        ruff check .

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django

    - name: Run Pytest
      env:
        DB_NAME: finsight_db
        DB_USER: admin
        DB_PASSWORD: adminpassword
        DB_HOST: localhost
        SECRET_KEY: fake-key-for-testing
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest
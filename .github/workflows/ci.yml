name: FinSight CI Pipeline

# 1. Cuándo se ejecuta el pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. Qué trabajos va a realizar
jobs:
  lint-and-test:
    runs-on: ubuntu-latest 

    # 3. Servicios adicionales (Postgres en este caso)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 4. Los pasos exactos adaptados a tu estructura de carpetas
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Linter
      run: |
        cd app
        ruff check .

    - name: Run Pytest
      env:
        POSTGRES_DB: finsight_db
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: adminpassword
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        OPENAI_API_KEY: sk-fake-key-for-testing
      run: |
        cd app
        pytest
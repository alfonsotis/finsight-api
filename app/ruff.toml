# app/ruff.toml

[lint]
# RUF012 requires using typing.ClassVar for class variables such as 'fields' or 'serializer_class'.
# In Django and DRF, the standard is to avoid ClassVar, so we disable this rule.
# BLE001 complains about using 'except Exception:', but in our asynchronous tasks we want to catch everything.
ignore = ["RUF012", "BLE001"]